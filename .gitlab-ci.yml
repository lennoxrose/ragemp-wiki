# Builds configs/docker/Dockerfile and pushes it to this project's GitLab Container Registry.
#   main    -> :latest and :<short sha>
#   git tag -> :<tag>
# Kaniko needs no privileged runner; any Docker or Kubernetes executor works.
build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
      variables: { DESTINATIONS: "--destination $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" }
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables: { DESTINATIONS: "--destination $CI_REGISTRY_IMAGE:latest --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" }
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - >
      /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile configs/docker/Dockerfile
      --cache=true --cache-repo "$CI_REGISTRY_IMAGE/cache" $DESTINATIONS
