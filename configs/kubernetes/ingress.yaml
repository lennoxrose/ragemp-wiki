# Rails runs with force_ssl, so TLS must terminate at the ingress (which must send X-Forwarded-Proto).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ragemp-wiki
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt   # CHANGE_ME or remove if you do not use cert-manager
spec:
  ingressClassName: nginx                         # CHANGE_ME (traefik on k3s)
  tls:
    - hosts: [wiki.example.com]
      secretName: ragemp-wiki-tls
  rules:
    - host: wiki.example.com                      # CHANGE_ME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: ragemp-wiki, port: { number: 80 } }
